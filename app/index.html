<script>
/* Desktop: show the phone at its real size (390 × 844, an iPhone 15) and scale the whole device to fit the window. */
(function () {
  var fit = function () {
    var s = 1, w = innerWidth, h = innerHeight;
    if (w > 500) s = Math.min(1, (h - 32) / 868, (w - (w > 820 ? 386 : 40)) / 414);
    document.documentElement.style.setProperty('--s', Math.max(0.4, s).toFixed(4));
  };
  fit(); addEventListener('resize', fit);
})();
</script>
